<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 360" width="980" height="360" role="img">
<title>without FlowEdge  vs  with FlowEdge</title>
<defs>
<marker id='vs-tools-arr' markerWidth='10' markerHeight='10' refX='8' refY='3.2' orient='auto'><path d='M0,0 L10,3.2 L0,6.4 Z' fill='#2B2118'/></marker>
</defs>
<rect width="100%" height="100%" rx="22" fill="#FFF6DC" stroke="#E8D7A8" stroke-width="3"/>
<text x="28" y="38" font-size="22" font-family="Trebuchet MS, Segoe UI, sans-serif" font-weight="800" fill="#1B4B6B">without FlowEdge  vs  with FlowEdge</text>
<g transform="rotate(0.22 176 185)"><rect x="39" y="75" width="280" height="230" rx="16" fill="#E8C98A" opacity="0.45"/><rect x="36" y="70" width="280" height="230" rx="16" fill="#FF8FAB" stroke="#2B2118" stroke-width="2.6"/>
</g>
<text x="176" y="108" text-anchor="middle" font-size="20" font-family="Trebuchet MS, Segoe UI, sans-serif" font-weight="800" fill="#1B4B6B">Keep PyTorch</text>
<text x="176" y="142" text-anchor="middle" font-size="14" font-family="Trebuchet MS, Segoe UI, sans-serif" font-weight="600" fill="#2B2118">train + encode RGB</text>
<text x="176" y="162" text-anchor="middle" font-size="14" font-family="Trebuchet MS, Segoe UI, sans-serif" font-weight="600" fill="#2B2118">malloc after warmup</text>
<text x="176" y="182" text-anchor="middle" font-size="14" font-family="Trebuchet MS, Segoe UI, sans-serif" font-weight="600" fill="#2B2118">you invent --on-miss</text>
<text x="176" y="202" text-anchor="middle" font-size="14" font-family="Trebuchet MS, Segoe UI, sans-serif" font-weight="600" fill="#2B2118">KV cache can grow</text>
<text x="176" y="248" text-anchor="middle" font-size="13" font-family="Trebuchet MS, Segoe UI, sans-serif" font-weight="600" fill="#1B4B6B">right for training</text>
<g transform="rotate(0.03 490 185)"><rect x="353" y="75" width="280" height="230" rx="16" fill="#E8C98A" opacity="0.45"/><rect x="350" y="70" width="280" height="230" rx="16" fill="#FFD166" stroke="#2B2118" stroke-width="2.6"/>
</g>
<text x="490" y="108" text-anchor="middle" font-size="20" font-family="Trebuchet MS, Segoe UI, sans-serif" font-weight="800" fill="#1B4B6B">ONNX / TRT / ET</text>
<text x="490" y="142" text-anchor="middle" font-size="14" font-family="Trebuchet MS, Segoe UI, sans-serif" font-weight="600" fill="#2B2118">general graph</text>
<text x="490" y="162" text-anchor="middle" font-size="14" font-family="Trebuchet MS, Segoe UI, sans-serif" font-weight="600" fill="#2B2118">any opset that fits</text>
<text x="490" y="182" text-anchor="middle" font-size="14" font-family="Trebuchet MS, Segoe UI, sans-serif" font-weight="600" fill="#2B2118">RSS is the compiler's</text>
<text x="490" y="202" text-anchor="middle" font-size="14" font-family="Trebuchet MS, Segoe UI, sans-serif" font-weight="600" fill="#2B2118">measure on your board</text>
<text x="490" y="248" text-anchor="middle" font-size="13" font-family="Trebuchet MS, Segoe UI, sans-serif" font-weight="600" fill="#1B4B6B">not this miss contract</text>
<g transform="rotate(-0.23 804 185)"><rect x="667" y="75" width="280" height="230" rx="16" fill="#E8C98A" opacity="0.45"/><rect x="664" y="70" width="280" height="230" rx="16" fill="#2EC4B6" stroke="#2B2118" stroke-width="2.6"/>
</g>
<text x="804" y="108" text-anchor="middle" font-size="20" font-family="Trebuchet MS, Segoe UI, sans-serif" font-weight="800" fill="#1B4B6B">FlowEdge Core</text>
<text x="804" y="142" text-anchor="middle" font-size="14" font-family="Trebuchet MS, Segoe UI, sans-serif" font-weight="600" fill="#2B2118">this flow or DP head</text>
<text x="804" y="162" text-anchor="middle" font-size="14" font-family="Trebuchet MS, Segoe UI, sans-serif" font-weight="600" fill="#2B2118">arena sized at load</text>
<text x="804" y="182" text-anchor="middle" font-size="14" font-family="Trebuchet MS, Segoe UI, sans-serif" font-weight="600" fill="#2B2118">--on-miss hold|drop|raise</text>
<text x="804" y="202" text-anchor="middle" font-size="14" font-family="Trebuchet MS, Segoe UI, sans-serif" font-weight="600" fill="#2B2118">encoder stays outside</text>
<text x="804" y="248" text-anchor="middle" font-size="13" font-family="Trebuchet MS, Segoe UI, sans-serif" font-weight="600" fill="#1B4B6B">right for the period</text>
<text x="490" y="330" text-anchor="middle" font-size="14" font-family="Trebuchet MS, Segoe UI, sans-serif" font-weight="800" fill="#1B4B6B">same checkpoint in, action chunk out  ·  only DP has a published p50 vs PyTorch</text>
</svg>