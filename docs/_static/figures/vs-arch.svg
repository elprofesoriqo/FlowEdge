<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 280" width="980" height="280" role="img">
<title>same checkpoint, two engines</title>
<defs>
<marker id='vs-arch-arr' markerWidth='10' markerHeight='10' refX='8' refY='3.2' orient='auto'><path d='M0,0 L10,3.2 L0,6.4 Z' fill='#2B2118'/></marker>
</defs>
<rect width="100%" height="100%" rx="22" fill="#FFF6DC" stroke="#E8D7A8" stroke-width="3"/>
<text x="28" y="38" font-size="22" font-family="Trebuchet MS, Segoe UI, sans-serif" font-weight="800" fill="#1B4B6B">same checkpoint, two engines</text>
<g transform="rotate(-0.06 260 145)"><rect x="53" y="75" width="420" height="150" rx="16" fill="#E8C98A" opacity="0.45"/><rect x="50" y="70" width="420" height="150" rx="16" fill="#2EC4B6" stroke="#2B2118" stroke-width="2.6"/>
</g>
<text x="260" y="108" text-anchor="middle" font-size="20" font-family="Trebuchet MS, Segoe UI, sans-serif" font-weight="800" fill="#1B4B6B">Flow matching</text>
<text x="260" y="140" text-anchor="middle" font-size="14" font-family="Trebuchet MS, Segoe UI, sans-serif" font-weight="600" fill="#2B2118">vs PyTorch ULP on mamba_flow</text>
<text x="260" y="160" text-anchor="middle" font-size="14" font-family="Trebuchet MS, Segoe UI, sans-serif" font-weight="600" fill="#2B2118">~1e-6 rel   ·   Euler NFE=10</text>
<text x="260" y="180" text-anchor="middle" font-size="14" font-family="Trebuchet MS, Segoe UI, sans-serif" font-weight="600" fill="#2B2118">correctness, not a policy p50</text>
<g transform="rotate(-0.04 720 145)"><rect x="513" y="75" width="420" height="150" rx="16" fill="#E8C98A" opacity="0.45"/><rect x="510" y="70" width="420" height="150" rx="16" fill="#6BCB77" stroke="#2B2118" stroke-width="2.6"/>
</g>
<text x="720" y="108" text-anchor="middle" font-size="20" font-family="Trebuchet MS, Segoe UI, sans-serif" font-weight="800" fill="#1B4B6B">Diffusion Policy</text>
<text x="720" y="140" text-anchor="middle" font-size="14" font-family="Trebuchet MS, Segoe UI, sans-serif" font-weight="600" fill="#2B2118">vs LeRobot/PyTorch DDIM</text>
<text x="720" y="160" text-anchor="middle" font-size="14" font-family="Trebuchet MS, Segoe UI, sans-serif" font-weight="600" fill="#2B2118">851 vs 1409 ms policy p50</text>
<text x="720" y="180" text-anchor="middle" font-size="14" font-family="Trebuchet MS, Segoe UI, sans-serif" font-weight="600" fill="#2B2118">threads=1, matched PushT</text>
<text x="490" y="250" text-anchor="middle" font-size="14" font-family="Trebuchet MS, Segoe UI, sans-serif" font-weight="800" fill="#1B4B6B">two heads, two claims  ·  do not average them into one speedup</text>
</svg>