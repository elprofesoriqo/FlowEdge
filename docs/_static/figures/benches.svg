<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 250" width="940" height="250" role="img">
<title>do not mix the evidence</title>
<defs>
<marker id='benches-arr' markerWidth='10' markerHeight='10' refX='8' refY='3.2' orient='auto'><path d='M0,0 L10,3.2 L0,6.4 Z' fill='#2B2118'/></marker>
</defs>
<rect width="100%" height="100%" rx="22" fill="#FFF6DC" stroke="#E8D7A8" stroke-width="3"/>
<text x="28" y="38" font-size="22" font-family="Trebuchet MS, Segoe UI, sans-serif" font-weight="800" fill="#1B4B6B">do not mix the evidence</text>
<g transform="rotate(-0.03 124 126)"><rect x="27" y="83" width="200" height="96" rx="16" fill="#E8C98A" opacity="0.45"/><rect x="24" y="78" width="200" height="96" rx="16" fill="#FFD166" stroke="#2B2118" stroke-width="2.6"/>
<text x="124" y="116" text-anchor="middle" font-size="18" font-family="Trebuchet MS, Segoe UI, sans-serif" font-weight="800" fill="#2B2118">kernels</text>
<text x="124" y="138" text-anchor="middle" font-size="15" font-family="Trebuchet MS, Segoe UI, sans-serif" font-weight="600" fill="#2B2118">microbench</text>
</g>
<g transform="rotate(-0.25 352 126)"><rect x="255" y="83" width="200" height="96" rx="16" fill="#E8C98A" opacity="0.45"/><rect x="252" y="78" width="200" height="96" rx="16" fill="#FF8FAB" stroke="#2B2118" stroke-width="2.6"/>
<text x="352" y="116" text-anchor="middle" font-size="18" font-family="Trebuchet MS, Segoe UI, sans-serif" font-weight="800" fill="#2B2118">Relay tail</text>
<text x="352" y="138" text-anchor="middle" font-size="15" font-family="Trebuchet MS, Segoe UI, sans-serif" font-weight="600" fill="#2B2118">queues</text>
</g>
<g transform="rotate(-0.09 580 126)"><rect x="483" y="83" width="200" height="96" rx="16" fill="#E8C98A" opacity="0.45"/><rect x="480" y="78" width="200" height="96" rx="16" fill="#2EC4B6" stroke="#2B2118" stroke-width="2.6"/>
<text x="580" y="116" text-anchor="middle" font-size="18" font-family="Trebuchet MS, Segoe UI, sans-serif" font-weight="800" fill="#2B2118">policy vs PT</text>
<text x="580" y="138" text-anchor="middle" font-size="15" font-family="Trebuchet MS, Segoe UI, sans-serif" font-weight="600" fill="#2B2118">matched replay</text>
</g>
<g transform="rotate(-0.22 808 126)"><rect x="711" y="83" width="200" height="96" rx="16" fill="#E8C98A" opacity="0.45"/><rect x="708" y="78" width="200" height="96" rx="16" fill="#6BCB77" stroke="#2B2118" stroke-width="2.6"/>
<text x="808" y="116" text-anchor="middle" font-size="18" font-family="Trebuchet MS, Segoe UI, sans-serif" font-weight="800" fill="#2B2118">period misses</text>
<text x="808" y="138" text-anchor="middle" font-size="15" font-family="Trebuchet MS, Segoe UI, sans-serif" font-weight="600" fill="#2B2118">robot loop</text>
</g>
<g transform="rotate(-0.7 220 196)"><rect x="220" y="196" width="389" height="36" rx="9" fill="#FF9F43" stroke="#2B2118" stroke-width="2.2"/><text x="415" y="220" text-anchor="middle" font-size="14" font-family="Trebuchet MS, Segoe UI, sans-serif" font-weight="800" fill="#2B2118">only the last two are control-loop numbers</text></g>
</svg>