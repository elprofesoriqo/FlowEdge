name: Setup LLVM
description: Install clang, clang-format, clang-tidy and ninja, symlinked to unversioned names.
inputs:
  version:
    description: LLVM
    default: "23"
runs:
  using: composite
  steps:
    - shell: bash
      run: |
        # The hosted runner's Chrome index is unrelated to FlowEdge and can
        # publish stale hashes while the LLVM packages are being refreshed.
        for source in /etc/apt/sources.list.d/*chrome*; do
          [[ -e "$source" ]] && sudo rm -f "$source"
        done
        sudo mkdir -p /etc/apt/trusted.gpg.d
        wget --tries=5 --waitretry=5 -qO- https://apt.llvm.org/llvm-snapshot.gpg.key \
          | sudo tee /etc/apt/trusted.gpg.d/apt.llvm.org.asc >/dev/null
        sudo add-apt-repository -y \
          "deb http://apt.llvm.org/noble/ llvm-toolchain-noble-${{ inputs.version }} main"
        sudo apt-get update
        sudo apt-get install -y "clang-${{ inputs.version }}" \
          "clang-format-${{ inputs.version }}" "clang-tidy-${{ inputs.version }}" ninja-build
        for t in clang clang++ clang-format clang-tidy; do
          sudo ln -sf "/usr/bin/${t}-${{ inputs.version }}" "/usr/local/bin/${t}"
        done
