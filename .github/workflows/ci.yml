name: CI
on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-llvm
      - run: ./scripts/build.sh
      - run: ./scripts/lint.sh

  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-llvm
      - run: ./scripts/build.sh Release -DFLOWEDGE_VERIFY=ON
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install torch (CPU)
        run: |
          pip install --index-url https://download.pytorch.org/whl/cpu torch
          pip install numpy safetensors
      - name: Synthetic checkpoint + baseline reference
        run: |
          python scripts/gen_synthetic_model.py models/synthetic.safetensors
          python scripts/torch_ref.py dump models/synthetic.safetensors models/baseline_synth
      - name: Correctness gate
        run: ./build/verify/verify models/synthetic.safetensors models/baseline_synth.bin

  bench:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-llvm
      - name: Cache Google Benchmark
        uses: actions/cache@v4
        with:
          path: build/_deps
          key: gbench-v1.9.1-${{ runner.os }}
      - run: ./scripts/build.sh Release -DFLOWEDGE_BENCH=ON
      - name: Kernel microbenchmarks (report-only)
        run: |
          ./build/bench/flowedge_kernels_bench \
            --benchmark_out=kernels.json --benchmark_out_format=json | tee kernels.txt
      - name: Job summary
        if: always()
        run: |
          {
            echo '### Kernel microbenchmarks — Mamba-130M sizes, seq=4'
            echo '```'
            cat kernels.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kernel-benchmarks
          path: kernels.json
