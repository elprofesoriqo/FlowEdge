name: CI
on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-llvm
      - run: ./scripts/build.sh
      - run: ./scripts/lint.sh

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-llvm
      - run: ./scripts/build.sh Release -DFLOWEDGE_TESTS=ON
      - name: Test suite (ctest)
        run: ctest --test-dir build --output-on-failure

  bench:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-llvm
      - name: Cache Google Benchmark
        uses: actions/cache@v4
        with:
          path: build/_deps
          key: gbench-v1.9.1-${{ runner.os }}
      - run: ./scripts/build.sh Release -DFLOWEDGE_BENCH=ON
      - name: Kernel microbenchmarks (report-only)
        run: |
          ./build/bench/flowedge_kernels_bench \
            --benchmark_out=kernels.json --benchmark_out_format=json | tee kernels.txt
      - name: Flow head + ODE benchmark (report-only)
        run: ./build/bench/flowedge_flow_bench | tee flow.txt
      - name: Job summary
        if: always()
        run: |
          {
            echo '### Kernel microbenchmarks — Mamba-130M sizes, seq=4'
            echo '```'
            cat kernels.txt
            echo '```'
            echo '### Flow head + ODE (Euler/Heun)'
            echo '```'
            cat flow.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kernel-benchmarks
          path: kernels.json
