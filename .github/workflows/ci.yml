name: CI
on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

jobs:
  format:
    name: Clang Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-llvm
      - run: |
          find . \( -name "*.h" -o -name "*.cc" -o -name "*.cpp" -o -name "*.cu" -o -name "*.mm" \) \
            ! -path "*/build/*" -print0 \
            | xargs -0 clang-format --style=file --Werror --dry-run

  tidy:
    name: Clang Tidy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-llvm
      - run: cmake -B build -S . -DCMAKE_EXPORT_COMPILE_COMMANDS=ON
      - run: |
          find . \( -name "*.cc" -o -name "*.cpp" \) \
            ! -path "*/build/*" ! -path "*/bench/*" ! -path "*/test/*" ! -path "*/python/*" -print0 \
            | xargs -0 clang-tidy -p build

  test:
    name: Test & Verify (${{ matrix.os }}, ${{ matrix.backend }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        backend: [cpu]
    steps:
      - uses: actions/checkout@v4
      - name: Setup Environment
        if: runner.os == 'Linux'
        uses: ./.github/actions/setup-llvm
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      
      - name: Configure CMake
        run: cmake -B build -S . -DFLOWEDGE_TESTS=ON -DFLOWEDGE_PYTHON=ON -DFLOWEDGE_BACKEND=${{ matrix.backend }}

      - name: Build
        if: matrix.backend == 'cpu'
        run: cmake --build build --config Release -j 4
        
      - name: CTest Suite
        if: matrix.backend == 'cpu'
        run: ctest --test-dir build -C Release --output-on-failure

      - name: Verify ULP vs PyTorch
        if: matrix.backend == 'cpu'
        run: |
          pip install --extra-index-url https://download.pytorch.org/whl/cpu torch numpy safetensors
          mkdir -p models
          wget -qO models/mamba_flow.safetensors "https://huggingface.co/ReForceMind/mamba_flow/resolve/main/mamba_flow.safetensors"
          python scripts/verify_ulp.py models/mamba_flow.safetensors
        env:
          PYTHONPATH: build/python

  docker:
    name: Docker Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build Image
        run: docker build -t flowedge:latest .
