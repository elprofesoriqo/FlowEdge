[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "lerobot_policy_flowedge"
version = "0.1.0"
description = "LeRobot out-of-tree deployment plugin for FlowEdge Diffusion Policy inference"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
dependencies = [
  "flowedge>=0.1.0",
  "lerobot>=0.4.4,<0.5",
  "numpy>=1.20",
]

[project.scripts]
flowedge-lerobot-rollout = "flowedge_lerobot.cli:main"
flowedge-lerobot-benchmark = "flowedge_lerobot.benchmark:main"
flowedge-lerobot-evaluate = "flowedge_lerobot.evaluate:main"

[project.optional-dependencies]
evaluation = ["gym-pusht==0.1.5", "pymunk>=6.6,<7"]
smolvla = ["lerobot[smolvla]>=0.4.4,<0.5"]

[tool.setuptools.packages.find]
where = ["src"]
