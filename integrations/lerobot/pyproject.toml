[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "flowedge-lerobot"
version = "0.1.0"
description = "LeRobot deployment adapter for FlowEdge Diffusion Policy inference"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
dependencies = [
  "flowedge>=0.1.0",
  "numpy>=1.20",
]

[project.scripts]
flowedge-lerobot-rollout = "flowedge_lerobot.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
